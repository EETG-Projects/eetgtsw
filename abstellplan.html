<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digitaler Abstellplan</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f6f7;
    --panel: #ffffff;
    --panel2: #f7f8f9;
    --border: #dfe3e6;
    --text: #20252a;
    --muted: #69727b;
    --accent: #b5121b;
    --danger: #b5121b;
    --track: #6f767d;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

/* =========================================================
   HEADER
========================================================= */

header {
height: 64px;
background: #ffffff;
border-bottom: 1px solid var(--border);
box-shadow: 0 2px 12px rgba(24,27,31,.06);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.header-info {
    color: var(--muted);
    font-size: 13px;
}

.user-box{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.role-badge{padding:4px 8px;border-radius:999px;background:#30343b;color:#fff;font-weight:700}
.readonly-note{padding:10px 12px;margin:10px 15px;border:1px solid #6b7280;border-radius:6px;color:#d1d5db;font-size:12px;display:none}
body.readonly .readonly-note{display:block}
body.readonly .write-only{display:none!important}
.admin-only{display:none!important}
body.is-admin .admin-only{display:flex!important}

.track {
    min-height: 150px;
}

.track-title-box{
    position:absolute;
    left:10px;
    top:14px;
    width:60px;
    z-index:25;
    text-align:center;
}
.track-title{
    font-size:14px;
    font-weight:800;
    line-height:1.15;
    word-break:break-word;
}
.track-length-label{
    margin-top:4px;
    color:var(--muted);
    font-size:10px;
}
.track-edit-btn{
    margin-top:7px;
    padding:4px 6px;
    font-size:10px;
    background:#5d646b;
}

.vehicle-wrap{
    position:absolute;
    top:43px;
    z-index:10;
}

.vehicle-wrap .vehicle{
    position:relative;
    top:0;
    left:0!important;
    width:100%;
}

.vehicle-status{
    width:100%;
    margin-top:4px;
    height:26px;
    padding:2px 5px;
    border:1px solid var(--border);
    border-radius:5px;
    background:#ffffff;
    color:var(--text);
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

.vehicle-status:disabled{
    cursor:default;
    opacity:.75;
}

.vehicle-status.status-unterwegs{border-color:#facc15;background:#3a3210;color:#fff}
.vehicle-status.status-werkstatt{border-color:#f97316;background:#3b2110;color:#fff}
.vehicle-status.status-vermietet{border-color:#3b82f6;background:#10264a;color:#fff}
.vehicle-status.status-abgestellt{border-color:#ef4444;background:#451515;color:#fff}
.vehicle-status.status-einsatzbereit{border-color:#22c55e;background:#123a20;color:#fff;font-weight:800}



/* =========================================================
   APP
========================================================= */

.app {
    display: flex;
    height: calc(100vh - 64px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 300px;
    min-width: 300px;

    background: var(--panel);

    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;
}

.sidebar-section {
    padding: 15px;
    border-bottom: 1px solid var(--border);
}

.sidebar-title {
    font-size: 14px;
    font-weight: bold;

    margin-bottom: 10px;
}


/* Buttons */

button {
    border: none;
    border-radius: 5px;

    padding: 9px 12px;

    background: var(--accent);
    color: white;

    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

button.secondary {
    background: #5d646b;
}

button.danger {
    background: var(--danger);
}

.button-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}


/* =========================================================
   VEHICLE LIST
========================================================= */

.vehicle-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px;
}

.vehicle-item {
    background: var(--panel2);

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 9px;

    margin-bottom: 7px;

    cursor: grab;
}

.vehicle-item:hover {
    border-color: var(--accent);
}

.vehicle-name {
    font-weight: bold;
    font-size: 14px;
}

.vehicle-info {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;

    display: flex;
    flex-direction: column;

    min-width: 0;
}


/* Toolbar */

.workspace-toolbar {
    height: 48px;

    background: var(--panel);

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 0 12px;
}

.scale-info {
    margin-left: auto;

    color: var(--muted);

    font-size: 12px;
}


/* =========================================================
   PLAN
========================================================= */

.plan-container {
    flex: 1;

    overflow: auto;

    background:
        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 25px 25px;

    padding: 25px;
}


/* =========================================================
   TRACK
========================================================= */

.track {
    position: relative;

    height: 125px;

    margin-bottom: 25px;

    background: rgba(255,255,255,0.025);

    border: 1px solid var(--border);

    border-radius: 7px;

    min-width: 1000px;
}


/* Track number */

.track-number {
    position: absolute;

    left: 10px;
    top: 50%;

    transform: translateY(-50%);

    width: 55px;

    font-size: 16px;
    font-weight: bold;

    text-align: center;

    z-index: 20;
}


/* Track itself */

.track-line {
    position: absolute;

    left: 80px;
    right: 30px;

    top: 63px;

    height: 6px;

    background: var(--track);

    border-radius: 4px;

    z-index: 1;
}


/* Rails */

.track-line::before,
.track-line::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    height: 2px;

    background: #aaa;
}

.track-line::before {
    top: -7px;
}

.track-line::after {
    bottom: -7px;
}


/* =========================================================
   SCALE
========================================================= */

.scale {
    position: absolute;

    left: 80px;
    right: 30px;

    top: 15px;

    height: 20px;

    pointer-events: none;
}

.scale-mark {
    position: absolute;
    height: 7px;
    border-left: 1px solid #9aa0a6;
    color: var(--muted);
    font-size: 10px;
    padding-left: 0;
}

.scale-mark.scale-major {
    height: 14px;
    border-left: 2px solid var(--text);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    padding-left: 4px;
    white-space: nowrap;
    transform: translateY(-3px);
}


/* =========================================================
   VEHICLES ON TRACK
========================================================= */

.vehicle {
    position: absolute;

    top: 43px;

    height: 40px;

    border-radius: 5px;

    border: 2px solid;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    cursor: grab;

    user-select: none;

    z-index: 10;

    transition:
        box-shadow .1s,
        transform .1s;
}

.vehicle:hover {
    transform: translateY(-2px);
}

.vehicle.selected {
    box-shadow:
        0 0 0 2px white,
        0 0 12px rgba(59,130,246,.8);
}

.vehicle.lok {
    background: #a61b1b;
    border-color: #f87171;
}

.vehicle.wagen {
    background: #3f4650;
    border-color: #aeb4bc;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.7);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 1000;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 420px;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 9px;

    padding: 20px;
}

.modal-box h2 {
    margin-top: 0;
}

.form-row {
    margin-bottom: 13px;
}

.form-row label {
    display: block;

    font-size: 12px;

    color: var(--muted);

    margin-bottom: 5px;
}

.form-row input,
.form-row select {
    width: 100%;

    padding: 10px;

    background: #15171a;

    color: white;

    border: 1px solid var(--border);

    border-radius: 5px;
}

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 18px;
}


/* =========================================================
   CONTEXT MENU
========================================================= */

.context-menu {
    position: fixed;

    display: none;

    width: 180px;

    background: #ffffff;

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 5px;

    z-index: 2000;

    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

.context-menu button {
    width: 100%;

    text-align: left;

    background: transparent;

    border-radius: 4px;
}

.context-menu button:hover {
    background: #30343b;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    color: var(--muted);

    text-align: center;

    padding: 20px;

    font-size: 13px;
}

.status-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    align-items:center;
    padding:10px 14px;
    margin:0 20px 14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    font-size:12px;
}
.status-legend strong{margin-right:4px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:13px;height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
.legend-einsatzbereit{background:#22c55e}
.legend-unterwegs{background:#facc15}
.legend-abgestellt{background:#ef4444}
.legend-vermietet{background:#3b82f6}
.legend-werkstatt{background:#f97316}


/* =========================================================
   EETG ORIGINALSEITEN-OPTIK
========================================================= */

    color:#20252a;
}

header{

button{

   WHITE / DARK MODE
========================================================= */

}

}

}

<body>

<header>

    <div class="logo">
        🚆 Digitaler Abstellplan
    </div>

    <div class="user-box">
        <span id="userName">–</span>
        <span class="role-badge" id="userRole">–</span>
        <button class="secondary theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="White/Darkmode wechseln">🌙 Dark</button>
        <button class="secondary" onclick="logout()">Abmelden</button>
    </div>

</header>
<div class="status-legend" aria-label="Legende Fahrzeugstatus">
    <strong>Legende:</strong>
    <span class="legend-item"><span class="legend-dot legend-einsatzbereit"></span>Einsatzbereit</span>
    <span class="legend-item"><span class="legend-dot legend-unterwegs"></span>Unterwegs</span>
    <span class="legend-item"><span class="legend-dot legend-abgestellt"></span>Abgestellt</span>
    <span class="legend-item"><span class="legend-dot legend-vermietet"></span>Vermietet</span>
    <span class="legend-item"><span class="legend-dot legend-werkstatt"></span>In der Werkstatt</span>
</div>



<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="sidebar-section">

        <div class="sidebar-title">
            Fahrzeugbibliothek
        </div>

        <div class="button-row write-only">

            <button class="admin-only" onclick="openVehicleModal()">
                + Fahrzeug
            </button>

            <button
                class="secondary admin-only"
                onclick="openTrackModal()">

                + Gleis

            </button>

        </div>

    </div>


    <div class="vehicle-list" id="vehicleLibrary"></div>


    <div class="readonly-note">
        Du bist als Betrachter angemeldet. Änderungen sind deaktiviert.
    </div>

    <div class="sidebar-section">

        <div class="sidebar-title">
            Zentrale Datenbank
        </div>

        <div class="button-row">

            <button onclick="loadPlan()">
                ↻ Aktualisieren
            </button>

            <button class="secondary write-only" onclick="savePlan()">
                💾 Alles speichern
            </button>

        </div>

    </div>

</aside>


<!-- =====================================================
     WORKSPACE
===================================================== -->

<main class="workspace">

    <div class="workspace-toolbar">

        <button class="write-only" onclick="createConsist()">
            🔗 Zugverband bilden
        </button>

        <button
            class="secondary"
            onclick="clearSelection()">

            Auswahl aufheben

        </button>

        <div class="scale-info">

            1 px = 0,5 m

        </div>

    </div>


    <div
        class="plan-container"
        id="plan">

    </div>

</main>

</div>


<!-- =====================================================
     VEHICLE MODAL
===================================================== -->

<div
    class="modal"
    id="vehicleModal">

    <div class="modal-box">

        <h2>Fahrzeug hinzufügen</h2>


        <div class="form-row">

            <label>
                Fahrzeugnummer
            </label>

            <input
                id="vehicleNumber"
                placeholder="z.B. 143 245-7">

        </div>


        <div class="form-row">

            <label>
                Baureihe / Modell
            </label>

            <input
                id="vehicleModel"
                placeholder="z.B. BR 143">

        </div>


        <div class="form-row">

            <label>
                Typ
            </label>

            <select id="vehicleType">

                <option value="lok">
                    Lokomotive
                </option>

                <option value="wagen">
                    Wagen
                </option>

            </select>

        </div>


        <div class="form-row">

            <label>
                Länge in Metern
            </label>

            <input
                id="vehicleLength"
                type="number"
                step="0.01"
                value="16.64">

        </div>


        <div class="modal-buttons">

            <button
                class="secondary"
                onclick="closeModals()">

                Abbrechen

            </button>

            <button
                onclick="addVehicle()">

                Hinzufügen

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TRACK MODAL
===================================================== -->

<div
    class="modal"
    id="trackModal">

    <div class="modal-box">

        <h2>Gleis hinzufügen</h2>


        <div class="form-row">

            <label>
                Gleisname
            </label>

            <input
                id="trackNumber"
                placeholder="z.B. Abstellung Nord 1">

        </div>


        <div class="form-row">

            <label>
                Gleislänge in Metern
            </label>

            <input
                id="trackLength"
                type="number"
                value="250">

        </div>


        <div class="modal-buttons">

            <button
                class="secondary"
                onclick="closeModals()">

                Abbrechen

            </button>

            <button
                onclick="addTrack()">

                Hinzufügen

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     CONTEXT MENU
===================================================== -->

<div
    class="context-menu"
    id="contextMenu">

    <button onclick="editSelected()">
        ✏ Fahrzeug bearbeiten
    </button>

    <button class="admin-only" onclick="removeSelected()">
        🗑 Fahrzeug löschen
    </button>

    <button onclick="clearSelection()">
        Auswahl aufheben
    </button>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/supabase.js"></script>
<script>
const PIXELS_PER_METER = 2;
const VEHICLE_VISUAL_SCALE = 2; // Fahrzeuge werden optisch x2 dargestellt.

let tracks = [];
let vehicles = [];
let selectedVehicle = null;
let currentUser = null;
let currentRole = "viewer";
let realtimeChannel = null;

function canWrite() {
    return currentRole === "dispatcher" || currentRole === "admin";
}

function isAdmin() {
    return currentRole === "admin";
}

function enforceAdminPermission() {
    if (isAdmin()) return true;
    alert("Nur Administratoren dürfen Gleise oder Fahrzeuge administrativ ändern/löschen.");
    return false;
}

function enforceWritePermission() {
    if (canWrite()) return true;
    alert("Du hast nur Leserechte.");
    return false;
}

async function requireLogin() {
    const { data: { session }, error } = await window.eetgSupabase.auth.getSession();

    if (error || !session) {
        window.location.replace("login.html?next=abstellplan.html");
        return false;
    }

    currentUser = session.user;

    const { data: profile, error: profileError } = await window.eetgSupabase
        .from("profiles")
        .select("role, display_name")
        .eq("id", currentUser.id)
        .single();

    if (profileError) {
        console.error("Profil konnte nicht geladen werden:", profileError);
        currentRole = "viewer";
    } else {
        currentRole = profile?.role || "viewer";
    }

    const fallbackUsername = (currentUser.email || "Angemeldet").split("@")[0];
    document.getElementById("userName").textContent =
        profile?.display_name || fallbackUsername;

    document.getElementById("userRole").textContent = currentRole;
    document.body.classList.toggle("readonly", !canWrite());
    document.body.classList.toggle("is-admin", currentRole === "admin");
    return true;
}

function applyTheme(theme) {
    const dark = theme === "dark";
    document.body.classList.toggle("dark", dark);

    const button = document.getElementById("themeToggle");
    if (button) {
        button.textContent = dark ? "☀️ White" : "🌙 Dark";
    }
}

function toggleTheme() {
    const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
    localStorage.setItem("eetg_abstellplan_theme", nextTheme);
    applyTheme(nextTheme);
}

function loadTheme() {
    const saved = localStorage.getItem("eetg_abstellplan_theme");
    const preferred = saved ||
        (window.matchMedia &&
         window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");

    applyTheme(preferred);
}

async function logout() {
    await window.eetgSupabase.auth.signOut();
    window.location.replace("login.html");
}

function mapTrack(row) {
    return {
        id: row.id,
        number: row.number,
        length: Number(row.length)
    };
}

function mapVehicle(row) {
    return {
        id: String(row.id),
        number: row.number,
        model: row.model || "",
        type: row.type,
        length: Number(row.length),
        track: row.track_id,
        position: Number(row.position || 0),
        consist: row.consist,
        status: row.status || "Abgestellt"
    };
}

async function loadPlan() {
    const [{ data: trackRows, error: trackError }, { data: vehicleRows, error: vehicleError }] =
        await Promise.all([
            window.eetgSupabase.from("tracks").select("*").order("sort_order", { ascending: true }).order("id"),
            window.eetgSupabase.from("vehicles").select("*").order("track_id").order("position")
        ]);

    if (trackError || vehicleError) {
        console.error(trackError || vehicleError);
        alert("Der Abstellplan konnte nicht aus Supabase geladen werden.");
        return;
    }

    tracks = (trackRows || []).map(mapTrack);
    vehicles = (vehicleRows || []).map(mapVehicle);

    renderPlan();
    renderLibrary();
}

function renderPlan() {
    const plan = document.getElementById("plan");
    plan.innerHTML = "";

    tracks.forEach(track => {
        const trackElement = document.createElement("div");
        trackElement.className = "track";
        trackElement.dataset.track = track.id;

        const width = track.length * PIXELS_PER_METER;
        trackElement.style.width = Math.max(width + 110, 1000) + "px";

        const titleBox = document.createElement("div");
        titleBox.className = "track-title-box";

        const title = document.createElement("div");
        title.className = "track-title";
        title.textContent = track.number;
        titleBox.appendChild(title);

        const lengthLabel = document.createElement("div");
        lengthLabel.className = "track-length-label";
        lengthLabel.textContent = track.length + " m";
        titleBox.appendChild(lengthLabel);

        if (isAdmin()) {
            const actions = document.createElement("div");
            actions.className = "track-admin-actions";

            const editButton = document.createElement("button");
            editButton.className = "track-edit-btn";
            editButton.textContent = "✏ Ändern";
            editButton.addEventListener("click", event => {
                event.stopPropagation();
                editTrack(track.id);
            });

            const deleteButton = document.createElement("button");
            deleteButton.className = "track-delete-btn";
            deleteButton.textContent = "🗑 Löschen";
            deleteButton.addEventListener("click", event => {
                event.stopPropagation();
                deleteTrack(track.id);
            });

            actions.appendChild(editButton);
            actions.appendChild(deleteButton);
            titleBox.appendChild(actions);
        }

        trackElement.appendChild(titleBox);

        const line = document.createElement("div");
        line.className = "track-line";
        trackElement.appendChild(line);

        const scale = document.createElement("div");
        scale.className = "scale";
        createScale(scale, track.length);
        trackElement.appendChild(scale);

        vehicles
            .filter(v => v.track === track.id)
            .forEach(vehicle => trackElement.appendChild(createVehicleElement(vehicle)));

        if (canWrite()) {
            trackElement.addEventListener("dragover", event => event.preventDefault());

            trackElement.addEventListener("drop", async event => {
                event.preventDefault();

                const id = event.dataTransfer.getData("vehicle");
                const vehicle = vehicles.find(v => v.id === id);
                if (!vehicle) return;

                const rect = trackElement.getBoundingClientRect();
                let x = event.clientX - rect.left - 80;
                let position = Math.max(0, x / PIXELS_PER_METER);

                if (vehicle.consist) {
                    await moveConsist(vehicle.consist, track.id, position);
                } else {
                    vehicle.track = track.id;
                    vehicle.position = position;
                    await updateVehicle(vehicle);
                }

                renderPlan();
            });
        }

        plan.appendChild(trackElement);
    });
}

function createScale(container, length) {
    for (let meter = 0; meter <= length; meter += 10) {
        const mark = document.createElement("div");
        mark.className = "scale-mark";
        mark.style.left = (meter * PIXELS_PER_METER) + "px";

        // Beschriftung nur alle 50 m für bessere Lesbarkeit.
        if (meter % 50 === 0) {
            mark.textContent = meter + " m";
            mark.classList.add("scale-major");
        }

        container.appendChild(mark);
    }
}

function statusClass(status) {
    if (status === "Unterwegs") return "status-unterwegs";
    if (status === "In der Werkstatt") return "status-werkstatt";
    if (status === "Vermietet") return "status-vermietet";
    if (status === "Einsatzbereit") return "status-einsatzbereit";
    return "status-abgestellt";
}

function createVehicleElement(vehicle) {
    const width = Math.max(
        vehicle.length * PIXELS_PER_METER * VEHICLE_VISUAL_SCALE,
        70
    );

    const wrap = document.createElement("div");
    wrap.className = "vehicle-wrap";
    wrap.style.left = (80 + vehicle.position * PIXELS_PER_METER) + "px";
    wrap.style.width = width + "px";

    const element = document.createElement("div");
    element.className = "vehicle " + vehicle.type;
    element.style.width = "100%";
    element.textContent = vehicle.number;
    element.draggable = canWrite();

    if (selectedVehicle === vehicle.id) {
        element.classList.add("selected");
    }

    element.addEventListener("click", event => {
        event.stopPropagation();
        selectedVehicle = vehicle.id;
        renderPlan();
    });

    if (canWrite()) {
        element.addEventListener("dragstart", event => {
            event.dataTransfer.setData("vehicle", vehicle.id);
        });

        element.addEventListener("contextmenu", event => {
            event.preventDefault();
            selectedVehicle = vehicle.id;
            showContextMenu(event.clientX, event.clientY);
        });

        element.addEventListener("dblclick", event => {
            event.stopPropagation();
            selectedVehicle = vehicle.id;
            editSelected();
        });
    }

    const statusSelect = document.createElement("select");
    statusSelect.className = "vehicle-status " + statusClass(vehicle.status);
    statusSelect.disabled = !canWrite();

    ["Einsatzbereit", "Abgestellt", "Unterwegs", "In der Werkstatt", "Vermietet"].forEach(status => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;
        option.selected = vehicle.status === status;
        statusSelect.appendChild(option);
    });

    statusSelect.addEventListener("click", event => event.stopPropagation());

    statusSelect.addEventListener("change", async event => {
        event.stopPropagation();
        if (!canWrite()) return;

        vehicle.status = statusSelect.value;
        statusSelect.className = "vehicle-status " + statusClass(vehicle.status);
        await updateVehicle(vehicle);
        renderLibrary();
    });

    wrap.appendChild(element);
    wrap.appendChild(statusSelect);

    return wrap;
}

async function updateVehicle(vehicle) {
    const { error } = await window.eetgSupabase
        .from("vehicles")
        .update({
            number: vehicle.number,
            model: vehicle.model,
            type: vehicle.type,
            length: vehicle.length,
            track_id: vehicle.track,
            position: vehicle.position,
            consist: vehicle.consist,
            status: vehicle.status || "Abgestellt",
            updated_at: new Date().toISOString()
        })
        .eq("id", Number(vehicle.id));

    if (error) {
        console.error(error);
        alert("Änderung konnte nicht gespeichert werden.");
    }
}

async function moveConsist(consistId, targetTrack, newStart) {
    if (!enforceWritePermission()) return;

    const consistVehicles = vehicles
        .filter(v => v.consist === consistId)
        .sort((a, b) => a.position - b.position);

    if (!consistVehicles.length) return;

    const offset = newStart - consistVehicles[0].position;

    consistVehicles.forEach(vehicle => {
        vehicle.track = targetTrack;
        vehicle.position = Math.max(0, vehicle.position + offset);
    });

    const results = await Promise.all(consistVehicles.map(updateVehicle));
    return results;
}

async function createConsist() {
    if (!enforceWritePermission()) return;

    const selected = vehicles.find(v => v.id === selectedVehicle);
    if (!selected) {
        alert("Bitte zuerst ein Fahrzeug auswählen.");
        return;
    }

    const nearby = vehicles
        .filter(v => v.track === selected.track)
        .filter(v => Math.abs(v.position - selected.position) < 40);

    if (nearby.length < 2) {
        alert("Mindestens zwei nahe Fahrzeuge auf demselben Gleis werden benötigt.");
        return;
    }

    const consistId = "zug_" + Date.now();
    nearby.forEach(v => v.consist = consistId);

    await Promise.all(nearby.map(updateVehicle));
    renderPlan();
}

function clearSelection() {
    selectedVehicle = null;
    hideContextMenu();
    renderPlan();
}

async function editSelected() {
    if (!enforceWritePermission()) return;

    const vehicle = vehicles.find(v => v.id === selectedVehicle);
    if (!vehicle) return;

    const number = prompt("Fahrzeugnummer:", vehicle.number);
    if (number !== null && number.trim()) vehicle.number = number.trim();

    const length = prompt("Reale Länge in Metern:", vehicle.length);
    if (length !== null && !isNaN(length) && Number(length) > 0) {
        vehicle.length = Number(length);
    }

    await updateVehicle(vehicle);
    renderPlan();
    renderLibrary();
    hideContextMenu();
}

async function removeSelected() {
    if (!enforceAdminPermission()) return;

    const vehicle = vehicles.find(v => v.id === selectedVehicle);
    if (!vehicle) return;

    if (!confirm(vehicle.number + " wirklich entfernen?")) return;

    const { error } = await window.eetgSupabase
        .from("vehicles")
        .delete()
        .eq("id", Number(vehicle.id));

    if (error) {
        console.error(error);
        alert("Fahrzeug konnte nicht gelöscht werden.");
        return;
    }

    selectedVehicle = null;
    await loadPlan();
    hideContextMenu();
}

function openVehicleModal() {
    if (!enforceAdminPermission()) return;
    document.getElementById("vehicleModal").classList.add("active");
}

async function addVehicle() {
    if (!enforceAdminPermission()) return;

    const number = document.getElementById("vehicleNumber").value.trim();
    const model = document.getElementById("vehicleModel").value.trim();
    const type = document.getElementById("vehicleType").value;
    const length = Number(document.getElementById("vehicleLength").value);

    if (!number) {
        alert("Bitte Fahrzeugnummer eingeben.");
        return;
    }

    if (!length || length <= 0) {
        alert("Bitte eine gültige Länge eingeben.");
        return;
    }

    if (!tracks.length) {
        alert("Bitte zuerst ein Gleis anlegen.");
        return;
    }

    const { error } = await window.eetgSupabase
        .from("vehicles")
        .insert({
            number,
            model,
            type,
            length,
            track_id: tracks[0].id,
            position: 10,
            consist: null,
            status: "Abgestellt"
        });

    if (error) {
        console.error(error);
        alert("Fahrzeug konnte nicht angelegt werden.");
        return;
    }

    closeModals();
    document.getElementById("vehicleNumber").value = "";
    await loadPlan();
}

function openTrackModal() {
    if (!enforceAdminPermission()) return;
    document.getElementById("trackModal").classList.add("active");
}

async function addTrack() {
    if (!enforceAdminPermission()) return;

    const number = document.getElementById("trackNumber").value.trim();
    const length = Number(document.getElementById("trackLength").value);

    if (!number) {
        alert("Bitte Gleisname eingeben.");
        return;
    }

    if (!length || length <= 0) {
        alert("Bitte eine gültige Gleislänge eingeben.");
        return;
    }

    const sortOrder = tracks.length
        ? Math.max(...tracks.map((_, index) => index + 1)) + 1
        : 1;

    const { error } = await window.eetgSupabase
        .from("tracks")
        .insert({
            number,
            length,
            sort_order: sortOrder
        });

    if (error) {
        console.error(error);
        alert("Gleis konnte nicht angelegt werden.");
        return;
    }

    closeModals();
    await loadPlan();
}

async function editTrack(trackId) {
    if (!enforceAdminPermission()) return;

    const track = tracks.find(t => t.id === trackId);
    if (!track) return;

    const name = prompt("Gleisname:", track.number);
    if (name === null) return;

    const cleanName = name.trim();
    if (!cleanName) {
        alert("Der Gleisname darf nicht leer sein.");
        return;
    }

    const lengthInput = prompt("Gleislänge in Metern:", track.length);
    if (lengthInput === null) return;

    const length = Number(String(lengthInput).replace(",", "."));
    if (!Number.isFinite(length) || length <= 0) {
        alert("Bitte eine gültige Gleislänge eingeben.");
        return;
    }

    const { error } = await window.eetgSupabase
        .from("tracks")
        .update({
            number: cleanName,
            length,
            updated_at: new Date().toISOString()
        })
        .eq("id", trackId);

    if (error) {
        console.error(error);
        alert("Gleis konnte nicht geändert werden.");
        return;
    }

    await loadPlan();
}


async function deleteTrack(trackId) {
    if (!enforceAdminPermission()) return;

    const track = tracks.find(t => t.id === trackId);
    if (!track) return;

    const vehiclesOnTrack = vehicles.filter(v => v.track === trackId);

    if (vehiclesOnTrack.length > 0) {
        alert(
            `Gleis "${track.number}" kann nicht gelöscht werden, solange noch ` +
            `${vehiclesOnTrack.length} Fahrzeug(e) darauf stehen. ` +
            `Verschiebe oder lösche diese Fahrzeuge zuerst.`
        );
        return;
    }

    if (!confirm(
        `Gleis "${track.number}" (${track.length} m) wirklich dauerhaft löschen?`
    )) return;

    const { error } = await window.eetgSupabase
        .from("tracks")
        .delete()
        .eq("id", trackId);

    if (error) {
        console.error(error);
        alert("Gleis konnte nicht gelöscht werden.");
        return;
    }

    await loadPlan();
}


function renderLibrary() {
    const library = document.getElementById("vehicleLibrary");
    library.innerHTML = "";

    if (!vehicles.length) {
        library.innerHTML = '<div class="empty">Keine Fahrzeuge vorhanden.</div>';
        return;
    }

    vehicles.forEach(vehicle => {
        const item = document.createElement("div");
        item.className = "vehicle-item";
        item.draggable = canWrite();

        item.innerHTML = `
            <div class="vehicle-name">${escapeHtml(vehicle.number)}</div>
            <div class="vehicle-info">
                ${escapeHtml(vehicle.model || vehicle.type)} · ${vehicle.length} m
            </div>
            <div class="vehicle-info">
                Status: ${escapeHtml(vehicle.status || "Abgestellt")}
            </div>
        `;

        if (canWrite()) {
            item.addEventListener("dragstart", event => {
                event.dataTransfer.setData("vehicle", vehicle.id);
            });
        }

        item.addEventListener("click", () => {
            selectedVehicle = vehicle.id;
            renderPlan();
        });

        library.appendChild(item);
    });
}

function closeModals() {
    document.querySelectorAll(".modal").forEach(modal => modal.classList.remove("active"));
}

function showContextMenu(x, y) {
    const menu = document.getElementById("contextMenu");
    menu.style.left = x + "px";
    menu.style.top = y + "px";
    menu.style.display = "block";
}

function hideContextMenu() {
    document.getElementById("contextMenu").style.display = "none";
}

document.addEventListener("click", hideContextMenu);

async function savePlan() {
    if (!enforceWritePermission()) return;
    await Promise.all(vehicles.map(updateVehicle));
    alert("Abstellplan wurde zentral gespeichert.");
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function subscribeRealtime() {
    if (realtimeChannel) {
        window.eetgSupabase.removeChannel(realtimeChannel);
    }

    realtimeChannel = window.eetgSupabase
        .channel("eetg-abstellplan")
        .on("postgres_changes", { event: "*", schema: "public", table: "tracks" }, () => loadPlan())
        .on("postgres_changes", { event: "*", schema: "public", table: "vehicles" }, () => loadPlan())
        .subscribe();
}

(async function init() {
    loadTheme();

    const ok = await requireLogin();
    if (!ok) return;

    await loadPlan();
    subscribeRealtime();
})();
</script>
</body>
