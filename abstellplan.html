<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGM Gleisbild-Prototyp | EETG</title>
<style>
:root{
  --bg:#f4f6f7;--panel:#fff;--line:#dfe3e6;--text:#20252a;--muted:#69727b;
  --accent:#b5121b;--track:#3b4147;--yard:#6f767d;--switch:#b5121b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{
  height:64px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
}
h1{font-size:18px;margin:0}
small{color:var(--muted)}
.controls{
  display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);
  flex-wrap:wrap
}
button{
  border:0;border-radius:8px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer
}
button.secondary{background:#41474e}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.wrap{height:calc(100vh - 115px);padding:12px}
.card{
  height:100%;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 8px 24px rgba(24,27,31,.06);position:relative
}
svg{width:100%;height:100%;display:block;background:
linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);
background-size:25px 25px}
.track{fill:none;stroke:var(--track);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.track.yard{stroke:var(--yard);stroke-width:2.4}
.track.siding{stroke:#737b84;stroke-width:2.2}
.switch{fill:var(--switch);stroke:#fff;stroke-width:1.2}
.buffer{fill:#111}
.label{
  font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round
}
.legend{
  position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-size:11px;display:flex;gap:12px;align-items:center
}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.sw{background:var(--switch)} .dot.bs{background:#111}
.notice{
  position:absolute;top:12px;left:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-size:11px;max-width:430px
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Frankfurt-Griesheim (FGM) – OSM-Gleisbild-Prototyp</h1>
    <small>Zentrum: 50.0934188 / 8.6144614</small>
  </div>
</header>

<div class="controls">
  <button onclick="loadOSM()">OSM-Gleise laden</button>
  <button class="secondary" onclick="fitView()">Ansicht einpassen</button>
  <button class="secondary" onclick="downloadSvg()">SVG speichern</button>
  <span class="status" id="status">Bereit</span>
</div>

<div class="wrap">
  <div class="card">
    <svg id="svg" viewBox="0 0 1400 760" preserveAspectRatio="xMidYMid meet">
      <g id="viewport"></g>
    </svg>
    <div class="notice">
      Reale OSM-Geometrie als Kontrollansicht. Im nächsten Schritt können wir daraus
      ein vereinfachtes Stellwerks-/Gleisbild mit geraden Segmenten und 45°-Weichen erzeugen.
    </div>
    <div class="legend">
      <span><span class="dot sw"></span>Weiche</span>
      <span><span class="dot bs"></span>Prellbock</span>
    </div>
  </div>
</div>

<script>
const CENTER={lat:50.0934187819572,lon:8.614461421966553};

// Ausschnitt um Bahnhof + angrenzende Betriebs-/Abstellflächen.
// Kann später im Code oder über UI enger/weiter gesetzt werden.
const BBOX={
  south:50.0870,
  west:8.6000,
  north:50.1000,
  east:8.6280
};

const svg=document.getElementById("svg");
const viewport=document.getElementById("viewport");
const statusEl=document.getElementById("status");

let bounds=null;

function status(t){statusEl.textContent=t}

function project(lat,lon){
  const W=1400,H=760,P=55;
  const x=P+(lon-BBOX.west)/(BBOX.east-BBOX.west)*(W-2*P);
  const y=H-P-(lat-BBOX.south)/(BBOX.north-BBOX.south)*(H-2*P);
  return [x,y];
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function lineClass(tags={}){
  const service=tags.service||"";
  if(service==="yard") return "track yard";
  if(service==="siding"||service==="spur") return "track siding";
  return "track";
}

function bestLabel(tags={}){
  return tags["railway:track_ref"] || tags.ref || tags.name || "";
}

function render(data){
  viewport.innerHTML="";
  const ways=data.elements.filter(e=>e.type==="way" && e.tags?.railway==="rail" && Array.isArray(e.geometry));
  const switches=data.elements.filter(e=>e.type==="node" && e.tags?.railway==="switch");
  const buffers=data.elements.filter(e=>e.type==="node" && e.tags?.railway==="buffer_stop");

  ways.forEach(w=>{
    const pts=w.geometry.map(n=>project(n.lat,n.lon));
    if(pts.length<2)return;
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",d);
    path.setAttribute("class",lineClass(w.tags));
    path.dataset.osmId=w.id;
    path.dataset.label=bestLabel(w.tags);
    viewport.appendChild(path);

    const label=bestLabel(w.tags);
    if(label){
      const mid=pts[Math.floor(pts.length/2)];
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",mid[0]+5);
      t.setAttribute("y",mid[1]-6);
      t.setAttribute("class","label");
      t.textContent=label;
      viewport.appendChild(t);
    }
  });

  switches.forEach(n=>{
    const [x,y]=project(n.lat,n.lon);
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",4.2);c.setAttribute("class","switch");
    c.dataset.osmId=n.id;
    viewport.appendChild(c);
  });

  buffers.forEach(n=>{
    const [x,y]=project(n.lat,n.lon);
    const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",x-4);r.setAttribute("y",y-4);r.setAttribute("width",8);r.setAttribute("height",8);r.setAttribute("class","buffer");
    viewport.appendChild(r);
  });

  status(`${ways.length} Gleiswege · ${switches.length} Weichen · ${buffers.length} Prellböcke`);
}

async function loadOSM(){
  status("Lade echte OSM-Daten …");

  const q=`[out:json][timeout:30];
  (
    way["railway"="rail"](${BBOX.south},${BBOX.west},${BBOX.north},${BBOX.east});
    node["railway"="switch"](${BBOX.south},${BBOX.west},${BBOX.north},${BBOX.east});
    node["railway"="buffer_stop"](${BBOX.south},${BBOX.west},${BBOX.north},${BBOX.east});
  );
  out geom;`;

  const endpoints=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  let lastError=null;

  for(const endpoint of endpoints){
    try{
      const response=await fetch(endpoint,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:"data="+encodeURIComponent(q)
      });

      if(!response.ok) throw new Error(`HTTP ${response.status}`);

      const data=await response.json();
      render(data);
      return;
    }catch(error){
      console.warn(endpoint,error);
      lastError=error;
    }
  }

  status("OSM konnte nicht geladen werden");
  alert("Die Overpass-Abfrage konnte nicht geladen werden.\\n\\n"+(lastError?.message||"Unbekannter Fehler"));
}

function fitView(){
  svg.setAttribute("viewBox","0 0 1400 760");
}

function downloadSvg(){
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:"image/svg+xml"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="FGM-OSM-Gleisbild.svg";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Automatisch laden.
loadOSM();
</script>
</body>
</html>
