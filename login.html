<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Abstellplan Login | EETG</title>

<link rel="stylesheet" href="./assets/css/style.css">

<style>
body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
    background:linear-gradient(145deg,#111820,#343b43);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}

.login-card{
    width:min(430px,100%);
    background:white;
    border-radius:18px;
    padding:34px;
    box-shadow:0 22px 60px rgba(0,0,0,.35);
}

.login-logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
}

.login-logo img{
    width:80px;
}

.login-logo strong{
    font-size:1rem;
}

h1{
    margin:0 0 8px;
    font-size:2rem;
}

.login-subtitle{
    margin:0 0 24px;
    color:#69727b;
}

label{
    display:block;
    font-weight:800;
    font-size:.9rem;
    margin:14px 0 6px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px 14px;
    border:1px solid #dfe3e6;
    border-radius:11px;
    font:inherit;
    outline:none;
}

input:focus{
    border-color:#bd2026;
    box-shadow:0 0 0 4px rgba(189,32,38,.10);
}

#loginButton{
    width:100%;
    margin-top:20px;
    padding:13px 18px;
    border:0;
    border-radius:12px;
    background:#bd2026;
    color:white;
    font-weight:800;
    cursor:pointer;
}

#loginButton:hover{
    background:#86151a;
}

#loginButton:disabled{
    opacity:.6;
    cursor:wait;
}

.message{
    min-height:24px;
    margin-top:14px;
    font-size:.9rem;
}

.message.error{
    color:#b91c1c;
}

.message.success{
    color:#138a57;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#69727b;
    font-size:.9rem;
}
</style>
</head>

<body>

<main class="login-card">

    <div class="login-logo">
        <img src="./assets/img/eetg-logo.png" alt="EETG Logo">
        <strong>EETG</strong>
    </div>

    <h1>Abstellplan Login</h1>

    <p class="login-subtitle">
        Bitte mit deinem EETG-Benutzernamen und Passwort anmelden.
    </p>

    <form id="loginForm">

        <label for="username">
            Benutzername
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="z. B. Pascal"
            required
        >

        <label for="password">
            Passwort
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Anmelden
        </button>

        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>

    </form>

    <a
        class="back"
        href="index.html"
    >
        ← Zur EETG-Startseite
    </a>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/supabase.js"></script>

<script>

const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


/* ==============================
   Zielseite bestimmen
============================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const nextPage =
    params.get("next") ||
    "abstellplan.html";


/* ==============================
   Bestehende Sitzung prüfen
============================== */

async function checkExistingSession() {

    const {
        data: { session },
        error
    } =
    await window.eetgSupabase
        .auth
        .getSession();


    if (error) {

        console.error(
            "Session-Prüfung fehlgeschlagen:",
            error
        );

        return;

    }


    if (session) {

        window.location.replace(
            nextPage
        );

    }

}


/* ==============================
   Login
============================== */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        message.className =
            "message";

        message.textContent =
            "";


        const username =
            document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        /*
         * Benutzername prüfen
         */

        if (
            !/^[a-z0-9._-]{2,32}$/
                .test(username)
        ) {

            message.className =
                "message error";

            message.textContent =
                "Ungültiger Benutzername.";

            return;

        }


        if (!password) {

            message.className =
                "message error";

            message.textContent =
                "Bitte Passwort eingeben.";

            return;

        }


        /*
         * Benutzername wird intern
         * zur technischen E-Mail.
         */

        const email =
            username +
            "@eetg-login.local";


        button.disabled =
            true;

        button.textContent =
            "Anmeldung läuft …";


        try {

            const {
                data,
                error
            } =
            await window.eetgSupabase
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            /*
             * Login fehlgeschlagen
             */

            if (error) {

                console.error(
                    "Supabase Login Fehler:",
                    error
                );


                message.className =
                    "message error";


                /*
                 * Benutzerfreundliche
                 * Fehlermeldungen
                 */

                if (
                    error.message
                        .toLowerCase()
                        .includes(
                            "invalid login credentials"
                        )
                ) {

                    message.textContent =
                        "Benutzername oder Passwort ist falsch.";

                }

                else if (
                    error.message
                        .toLowerCase()
                        .includes(
                            "email not confirmed"
                        )
                ) {

                    message.textContent =
                        "Dieser Benutzer ist noch nicht freigeschaltet.";

                }

                else {

                    message.textContent =
                        "Anmeldung fehlgeschlagen.";

                }


                button.disabled =
                    false;

                button.textContent =
                    "Anmelden";

                return;

            }


            /*
             * Prüfen ob Supabase
             * wirklich eine Sitzung geliefert hat
             */

            if (!data.session) {

                console.error(
                    "Keine Session nach erfolgreichem Login:",
                    data
                );

                message.className =
                    "message error";

                message.textContent =
                    "Anmeldung erfolgreich, aber keine Sitzung wurde erstellt.";

                button.disabled =
                    false;

                button.textContent =
                    "Anmelden";

                return;

            }


            /*
             * Login erfolgreich
             */

            console.log(
                "Login erfolgreich:",
                data.user
            );


            message.className =
                "message success";

            message.textContent =
                "Anmeldung erfolgreich.";


            /*
             * Weiterleitung
             */

            setTimeout(
                () => {

                    window.location.replace(
                        nextPage
                    );

                },
                300
            );


        }

        catch(error) {

            console.error(
                "Unerwarteter Login-Fehler:",
                error
            );


            message.className =
                "message error";

            message.textContent =
                "Verbindung zu Supabase fehlgeschlagen.";


            button.disabled =
                false;

            button.textContent =
                "Anmelden";

        }

    }
);


/* ==============================
   Start
============================== */

checkExistingSession();

</script>

</body>
</html>
